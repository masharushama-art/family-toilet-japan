name: IndexNow notify

# master への push から数分待ってサイトマップを送信
# 本番デプロイは npm run cf:deploy による手動CLI実行のため、pushが必ずしも
# 即時デプロイを意味しない点に注意(2026-08-11、ROADMAP.md参照)。
# デプロイ完了を厳密に待つ仕組みはないため、デプロイが十分終わる時間をおく
on:
  push:
    branches: [master]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deploy to finish
        run: sleep 180
      - name: Notify IndexNow
        run: node scripts/indexnow.js
